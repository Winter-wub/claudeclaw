# cargo-deny policy (#35). CI's `deny` job runs `bans licenses sources`; advisories run in
# `audit.yml`, weekly and on lockfile changes, so a new RustSec advisory never blocks an
# unrelated PR.

[graph]
# Every target and every feature, so Windows-only, Linux-only and optional deps are checked too.
targets = []
all-features = true

[advisories]
ignore = []

[licenses]
# Add a licence in the PR that brings the first crate needing it.
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path deps carry no version; every crate is `publish = false`.
allow-wildcard-paths = true
# One TLS stack: rustls on ring (architecture §2, D11).
deny = [
    { crate = "openssl-sys", reason = "one TLS stack: rustls on ring (architecture D11)" },
    { crate = "aws-lc-sys", reason = "ring is the only crypto provider (architecture D11)" },
    { crate = "native-tls", reason = "one TLS stack: rustls on ring (architecture D11)" },
]

[sources]
# crates.io only.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
