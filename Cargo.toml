[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Every crate except the Desktop app, so a root `cargo build`/`cargo test` never needs
# WebKitGTK or Node (architecture §2).
default-members = [
    "crates/claudeclaw",
    "crates/api",
    "crates/store",
    "crates/jobs",
    "crates/runner",
    "crates/scheduler",
    "crates/chat",
    "crates/core",
    "crates/discord",
    "crates/server",
    "crates/client",
    "crates/ts-compat",
    "crates/parity",
    "xtask",
]

[workspace.package]
# The only version source; `cargo xtask release prepare` sets it (#35).
version = "2.0.0-alpha.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/Winter-wub/claudeclaw"
# Installed from git, never crates.io (#35 §7).
publish = false

[workspace.dependencies]
# Workspace crates. Which may depend on which is architecture §3.1, enforced by `cargo xtask deps`.
claudeclaw-api = { path = "crates/api" }
claudeclaw-store = { path = "crates/store" }
claudeclaw-jobs = { path = "crates/jobs" }
claudeclaw-runner = { path = "crates/runner" }
claudeclaw-scheduler = { path = "crates/scheduler" }
claudeclaw-chat = { path = "crates/chat" }
claudeclaw-core = { path = "crates/core" }
claudeclaw-discord = { path = "crates/discord" }
claudeclaw-server = { path = "crates/server" }
claudeclaw-client = { path = "crates/client" }
claudeclaw-ts-compat = { path = "crates/ts-compat" }

# Third-party crates (architecture §10).
anyhow = "1.0.104"
cargo_metadata = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
croner = "4.0.1"
futures-util = "0.3.34"
secrecy = "0.10.3"
serde-saphyr = "1.3.0"
tempfile = "3.27.0"
# Crates add the features they use (architecture §10); none enables a runtime it doesn't need.
tokio = { version = "1.53", default-features = false }
tokio-util = "0.7.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
utoipa = { version = "6.0.0", features = ["chrono", "preserve_order"] }
