# RustSec advisories (#35 §4): weekly on main, and on PRs that change a lockfile. A failed
# scheduled run emails the maintainer. `npm audit` joins once crates/desktop/ui exists.
name: Audit

on:
  schedule:
    - cron: "23 4 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      lockfile: ${{ steps.flags.outputs.lockfile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: flags
        run: scripts/ci/changes.sh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  advisories:
    needs: changes
    if: needs.changes.outputs.lockfile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check advisories
