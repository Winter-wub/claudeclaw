[package]
name = "claudeclaw-store"
description = "On-disk layout, atomic IO, settings, sessions, job state, logs, lock and pid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
claudeclaw-api.workspace = true
chrono.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user"] }

# The `daemon.lock` byte-range lock (#80): `LockFileEx` / `UnlockFileEx`, so the holder record
# stays readable while the lock is held.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }
